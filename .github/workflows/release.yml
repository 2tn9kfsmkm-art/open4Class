name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $v) { $v = "0.0.0" }
          "VERSION=$v" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Host "版本: $v"

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set zstandard

      - name: Nuitka 编译
        shell: pwsh
        run: |
          .\build.ps1 -Version "${{ steps.ver.outputs.VERSION }}"
          if (-not (Test-Path "build\main.dist\ClassManager.exe")) {
            Write-Error "编译产物缺失：build\main.dist\ClassManager.exe"
            exit 1
          }
          Get-ChildItem build\main.dist | Select-Object -First 8 Name, Length

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "找不到 ISCC.exe"; exit 1 }
          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: 生成安装包
        shell: pwsh
        run: |
          & $env:ISCC "/DAPPVERSION=${{ steps.ver.outputs.VERSION }}" installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC 失败，退出码 $LASTEXITCODE"
            exit 1
          }
          Get-ChildItem installer | Select-Object Name, Length

      - name: 便携版 zip + 校验值
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer -Filter "ClassManager-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "没找到安装包"; exit 1 }
          $zip = "installer/ClassManager-portable-${{ github.ref_name }}.zip"
          Compress-Archive -Path "build\main.dist\*" -DestinationPath $zip -Force
          $lines = @()
          foreach ($f in @($exe.FullName, (Resolve-Path $zip).Path)) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath "installer/SHA256SUMS.txt" -Encoding utf8
          Get-Content "installer/SHA256SUMS.txt"

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            installer/*.exe
            installer/*.zip
            installer/SHA256SUMS.txt
