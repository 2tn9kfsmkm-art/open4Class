name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 也可以在网页上手动跑一次

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要全部 tag 才能取版本号

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set zstandard

      - name: 编译（Nuitka standalone）
        shell: cmd
        run: build.bat

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 生成安装包
        shell: cmd
        run: |
          set VERSION=${{ github.ref_name }}
          set VERSION=%VERSION:v=%
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPPVERSION=%VERSION% installer.iss

      - name: 便携版压缩包
        shell: cmd
        run: |
          cd build
          powershell Compress-Archive -Path main.dist\* -DestinationPath "..\installer\ClassManager-portable-${{ github.ref_name }}.zip" -Force

      - name: 校验值
        shell: cmd
        run: |
          cd installer
          certutil -hashfile *.exe SHA256 > SHA256SUMS.txt

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            installer/*.exe
            installer/*.zip
            installer/SHA256SUMS.txt
